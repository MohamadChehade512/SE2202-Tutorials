<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Course Explorer</h1>

  <section class="panel">
    <h2>Load Courses (JSON)</h2>
    <input type="file" id="fileInput" accept=".json">
    <p id="errorMsg" class="error"></p>
  </section>

  <section class="panel controls">
    <h2>Sort and Filter</h2>
    <div class="controls-row">
      <label>
        Department:
        <select id="deptFilter">
          <option value="All">All</option>
        </select>
      </label>

      <label>
        Level:
        <select id="levelFilter">
          <option value="All">All</option>
        </select>
      </label>

      <label>
        Credits:
        <select id="creditFilter">
          <option value="All">All</option>
        </select>
      </label>

      <label>
        Instructor:
        <select id="instructorFilter">
          <option value="All">All</option>
        </select>
      </label>

      <label>
        Sort By:
        <select id="sortSelect">
          <option value="none">None</option>
          <option value="id-az">ID (A–Z)</option>
          <option value="id-za">ID (Z–A)</option>
          <option value="title-az">Title (A–Z)</option>
          <option value="title-za">Title (Z–A)</option>
          <option value="sem-early">Semester (Earliest first)</option>
          <option value="sem-late">Semester (Latest first)</option>
        </select>
      </label>
    </div>
  </section>

  <section id="layout">
    <div id="courseList" class="course-list"></div>
    <div id="courseDetails" class="course-details">
      <p>Select a course from the list on the left.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
